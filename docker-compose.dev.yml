services:
  bifract:
    build: .
    image: bifract-dev
    environment:
      BIFRACT_MODEL_SCORE_INTERVAL: "30"

  caddy:
    # This list replaces the base file's, so the :ro flags must be repeated here.
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./caddy/ship-logs.sh:/usr/local/bin/ship-logs.sh:ro
      - ./caddy/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "8080:8080"

  postgres:
    ports:
      - "5432:5432"

  clickhouse:
    ports:
      - "8123:8123"
      - "9000:9000"
