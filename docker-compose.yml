# Keep in sync with internal/setup/templates/docker-compose.yml.tmpl
services:
  caddy:
    image: caddy:2-alpine
    container_name: bifract-caddy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/ship-logs.sh:/usr/local/bin/ship-logs.sh
      - ./caddy/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - caddy-data:/data
      - caddy-config:/config
    environment:
      BIFRACT_DOMAIN: ${BIFRACT_DOMAIN:-localhost}
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      - bifract
    networks:
      - bifract-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: bifract-postgres
    environment:
      POSTGRES_DB: bifract
      POSTGRES_USER: bifract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifract}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifract"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bifract-network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193-alpine
    container_name: bifract-clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bifract}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "${CLICKHOUSE_PASSWORD:-bifract}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bifract-network
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.81.14-stable
    container_name: bifract-litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-bifract-internal-key}
    command: ["--config", "/app/config.yaml", "--port", "8000"]
    networks:
      - bifract-network
    restart: unless-stopped

  bifract:
    image: bifract-dev
    container_name: bifract-app
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bifract}
      # Least-privilege ingest identities (app provisions them at startup so the ingest
      # tier gets INSERT-only CH access + a curated PG role; cannot read logs or auth data).
      BIFRACT_INGEST_CLICKHOUSE_PASSWORD: ${BIFRACT_INGEST_CLICKHOUSE_PASSWORD:-bifractingestdev}
      BIFRACT_INGEST_POSTGRES_PASSWORD: ${BIFRACT_INGEST_POSTGRES_PASSWORD:-bifractingestdev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bifract
      POSTGRES_USER: bifract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifract}
      BIFRACT_PORT: 8080
      BIFRACT_MAX_QUERY_ROWS: 250
      BIFRACT_SECURE_COOKIES: ${BIFRACT_SECURE_COOKIES:-false}
      BIFRACT_CORS_ORIGINS: ${BIFRACT_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      BIFRACT_PASSWORD_PEPPER: ${BIFRACT_PASSWORD_PEPPER:-}
      LITELLM_URL: http://litellm:8000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-bifract-internal-key}
      BIFRACT_BACKUP_ENCRYPTION_KEY: ${BIFRACT_BACKUP_ENCRYPTION_KEY:-}
      BIFRACT_S3_ENDPOINT: ${BIFRACT_S3_ENDPOINT:-}
      BIFRACT_S3_BUCKET: ${BIFRACT_S3_BUCKET:-}
      BIFRACT_S3_ACCESS_KEY: ${BIFRACT_S3_ACCESS_KEY:-}
      BIFRACT_S3_SECRET_KEY: ${BIFRACT_S3_SECRET_KEY:-}
      BIFRACT_S3_REGION: ${BIFRACT_S3_REGION:-}
      # Archive: the spool + tee live in the bifract-ingest tier (the primary log
      # producer); the app tier is not a spool writer. These are display-only hints
      # for the admin UI. Enable state is read from Postgres; provisioned/usage come
      # from the ingest tier's published status.
      BIFRACT_ARCHIVE_ENABLED: ${BIFRACT_ARCHIVE_ENABLED:-false}
      BIFRACT_ARCHIVE_BACKEND: ${BIFRACT_ARCHIVE_BACKEND:-disk}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_EDITION_IDS: ${MAXMIND_EDITION_IDS:-GeoLite2-City-CSV,GeoLite2-ASN-CSV}
    volumes:
      - bifract-maxmind:/data/maxmind
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - bifract-network

  # Ingest data-plane tier. Same image as bifract, run in ingest mode
  # (`/bifract-server ingest`, matching the archiver's command-arg dispatch).
  # Scales independently of the app/UI tier -- down to 0 to pause ingest during
  # ClickHouse merge recovery while the app keeps serving. Caddy routes the external
  # ingest paths here; the app tier keeps its own queue only for internal/audit
  # writes. This tier is the primary archive-spool producer.
  bifract-ingest:
    image: bifract-dev
    container_name: bifract-ingest
    restart: unless-stopped
    command: ["ingest"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: logs
      # Least-privilege ingest identities (INSERT-only on logs; curated PG grants).
      CLICKHOUSE_USER: bifract_ingest
      CLICKHOUSE_PASSWORD: ${BIFRACT_INGEST_CLICKHOUSE_PASSWORD:-bifractingestdev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bifract
      POSTGRES_USER: bifract_ingest
      POSTGRES_PASSWORD: ${BIFRACT_INGEST_POSTGRES_PASSWORD:-bifractingestdev}
      BIFRACT_PORT: 8080
      # Archive tee (dormant-but-present): the ingest tier is the sole spool writer.
      BIFRACT_ARCHIVE_ENABLED: ${BIFRACT_ARCHIVE_ENABLED:-false}
      BIFRACT_ARCHIVE_SPOOL_PATH: /var/lib/bifract/spool
      BIFRACT_ARCHIVE_SPOOL_MAX_BYTES: ${BIFRACT_ARCHIVE_SPOOL_MAX_BYTES:-10737418240}
      BIFRACT_ARCHIVE_ROLL_BYTES: ${BIFRACT_ARCHIVE_ROLL_BYTES:-134217728}
      BIFRACT_ARCHIVE_MAX_PENDING_BYTES: ${BIFRACT_ARCHIVE_MAX_PENDING_BYTES:-1073741824}
      BIFRACT_ARCHIVE_BACKEND: ${BIFRACT_ARCHIVE_BACKEND:-disk}
    volumes:
      - bifract-spool:/var/lib/bifract/spool
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # Start after the app (which owns migrations). The app has no compose
      # healthcheck here, so gate on start; the ingest tier's write-table readiness
      # poll waits for the schema before draining, and the queue retries otherwise.
      bifract:
        condition: service_started
    networks:
      - bifract-network

  # Iceberg archive sidecar (dormant-but-present). Same image as bifract, run
  # with the archiver command. Drains the shared spool into per-fractal Iceberg
  # tables on object storage. Idles until archiving is enabled at runtime.
  bifract-archiver:
    image: bifract-dev
    container_name: bifract-archiver
    restart: unless-stopped
    # Override the image ENTRYPOINT (/bifract-server); in compose `command` is
    # appended to the entrypoint, so the entrypoint itself must be replaced.
    entrypoint: ["/bifract-archiver"]
    command: ["run"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bifract
      POSTGRES_USER: bifract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifract}
      # ClickHouse connection: the restore/reconcile worker writes archived rows
      # back into the logs table, so the archiver needs the same CH access as the
      # server.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      BIFRACT_ARCHIVE_ENABLED: ${BIFRACT_ARCHIVE_ENABLED:-false}
      BIFRACT_ARCHIVE_BACKEND: ${BIFRACT_ARCHIVE_BACKEND:-disk}
      BIFRACT_ARCHIVE_DISK_PATH: /var/lib/bifract/archive
      BIFRACT_ARCHIVE_PREFIX: ${BIFRACT_ARCHIVE_PREFIX:-}
      BIFRACT_ARCHIVE_S3_ENDPOINT: ${BIFRACT_ARCHIVE_S3_ENDPOINT:-}
      BIFRACT_ARCHIVE_S3_BUCKET: ${BIFRACT_ARCHIVE_S3_BUCKET:-}
      BIFRACT_ARCHIVE_S3_REGION: ${BIFRACT_ARCHIVE_S3_REGION:-us-east-1}
      BIFRACT_ARCHIVE_S3_ACCESS_KEY: ${BIFRACT_ARCHIVE_S3_ACCESS_KEY:-}
      BIFRACT_ARCHIVE_S3_SECRET_KEY: ${BIFRACT_ARCHIVE_S3_SECRET_KEY:-}
      BIFRACT_ARCHIVE_AZURE_ACCOUNT: ${BIFRACT_ARCHIVE_AZURE_ACCOUNT:-}
      BIFRACT_ARCHIVE_AZURE_KEY: ${BIFRACT_ARCHIVE_AZURE_KEY:-}
      BIFRACT_ARCHIVE_AZURE_CONTAINER: ${BIFRACT_ARCHIVE_AZURE_CONTAINER:-}
      BIFRACT_ARCHIVE_AZURE_ENDPOINT: ${BIFRACT_ARCHIVE_AZURE_ENDPOINT:-}
      BIFRACT_ARCHIVE_SPOOL_PATH: /var/lib/bifract/spool
      BIFRACT_ARCHIVE_ROLL_BYTES: ${BIFRACT_ARCHIVE_ROLL_BYTES:-134217728}
      BIFRACT_ARCHIVE_ROLL_INTERVAL: ${BIFRACT_ARCHIVE_ROLL_INTERVAL:-1h}
      BIFRACT_ARCHIVE_MAX_PENDING_BYTES: ${BIFRACT_ARCHIVE_MAX_PENDING_BYTES:-1073741824}
      BIFRACT_RECALL_TIMEOUT: ${BIFRACT_RECALL_TIMEOUT:-5m}
    volumes:
      - bifract-spool:/var/lib/bifract/spool
      - bifract-archive:/var/lib/bifract/archive
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bifract-network

  # Iceberg maintenance (compaction + snapshot expiry): the always-on maintenance
  # service. A dedicated, resource-capped container running maintain-loop, kept
  # separate from the drain loop so a compaction memory spike OOMs only this
  # (mostly idle) container. Services scheduled passes
  # (BIFRACT_ARCHIVE_MAINTAIN_INTERVAL, default 1h) plus admin "Run now" requests
  # picked up from Postgres. Singleton via a Postgres advisory lock; disable by
  # scaling to 0. k8s runs the same maintain-loop as a replicas:1 Deployment.
  bifract-archiver-maintain:
    image: bifract-dev
    container_name: bifract-archiver-maintain
    restart: unless-stopped
    entrypoint: ["/bifract-archiver"]
    command: ["maintain-loop"]
    mem_limit: ${BIFRACT_ARCHIVE_MAINTAIN_MEM_LIMIT:-2g}
    cpus: ${BIFRACT_ARCHIVE_MAINTAIN_CPUS:-2}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bifract
      POSTGRES_USER: bifract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifract}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      BIFRACT_ARCHIVE_MAINTAIN_INTERVAL: ${BIFRACT_ARCHIVE_MAINTAIN_INTERVAL:-1h}
      # Sealed ingest days re-checked per pass for hot-store vs archive drift
      # (0 disables). Cost is fractals x days x 2 ClickHouse counts.
      BIFRACT_ARCHIVE_COMPLETENESS_DAYS: ${BIFRACT_ARCHIVE_COMPLETENESS_DAYS:-3}
      BIFRACT_ARCHIVE_ENABLED: ${BIFRACT_ARCHIVE_ENABLED:-false}
      BIFRACT_ARCHIVE_BACKEND: ${BIFRACT_ARCHIVE_BACKEND:-disk}
      BIFRACT_ARCHIVE_DISK_PATH: /var/lib/bifract/archive
      BIFRACT_ARCHIVE_PREFIX: ${BIFRACT_ARCHIVE_PREFIX:-}
      BIFRACT_ARCHIVE_S3_ENDPOINT: ${BIFRACT_ARCHIVE_S3_ENDPOINT:-}
      BIFRACT_ARCHIVE_S3_BUCKET: ${BIFRACT_ARCHIVE_S3_BUCKET:-}
      BIFRACT_ARCHIVE_S3_REGION: ${BIFRACT_ARCHIVE_S3_REGION:-us-east-1}
      BIFRACT_ARCHIVE_S3_ACCESS_KEY: ${BIFRACT_ARCHIVE_S3_ACCESS_KEY:-}
      BIFRACT_ARCHIVE_S3_SECRET_KEY: ${BIFRACT_ARCHIVE_S3_SECRET_KEY:-}
      BIFRACT_ARCHIVE_AZURE_ACCOUNT: ${BIFRACT_ARCHIVE_AZURE_ACCOUNT:-}
      BIFRACT_ARCHIVE_AZURE_KEY: ${BIFRACT_ARCHIVE_AZURE_KEY:-}
      BIFRACT_ARCHIVE_AZURE_CONTAINER: ${BIFRACT_ARCHIVE_AZURE_CONTAINER:-}
      BIFRACT_ARCHIVE_AZURE_ENDPOINT: ${BIFRACT_ARCHIVE_AZURE_ENDPOINT:-}
    volumes:
      - bifract-archive:/var/lib/bifract/archive
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bifract-network

volumes:
  postgres-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
  bifract-maxmind:
  bifract-spool:
  bifract-archive:

networks:
  bifract-network:
    driver: bridge
