rule: rule.yml
normalizer: ../../example-normalizers/sysmon-normalizer.yaml

# A threshold rule only fires when it sees several events at once, so every case sets
# `together: true`. Each case is still scoped to its own synthetic fractal, so the
# counts cannot be inflated by any other case.
cases:
  - name: three accesses from one process trip the threshold
    expect: match
    together: true
    count: 1
    logFile: three-accesses-one-process.json

  # Two is under the threshold. This is the assertion an offline filter-only matcher
  # could never make.
  - name: two accesses stay below the threshold
    expect: no_match
    together: true
    logFile: two-accesses-below-threshold.json

  # Three accesses spread across three images: no single image reaches the threshold,
  # so the grouping must keep them apart.
  - name: three accesses from three different processes
    expect: no_match
    together: true
    logFile: three-accesses-three-processes.json

  - name: repeated accesses to a non-lsass target
    expect: no_match
    together: true
    logFile: three-accesses-other-target.json
