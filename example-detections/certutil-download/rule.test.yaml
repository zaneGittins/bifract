rule: rule.yml
normalizer: ../../example-normalizers/sysmon-normalizer.yaml

cases:
  # Every event in the file must fire.
  - name: every known download variant fires
    expect: match
    logFile: true-positives.json

  # No event in the file may fire. Includes a file-write event that mentions
  # "urlcache", which must be excluded by the rule's process_creation logsource
  # rather than matched on text.
  - name: no benign certutil usage fires
    expect: no_match
    logFile: benign.json
