# ClickHouse cluster managed by the official ClickHouse Kubernetes Operator.
# Prerequisites:
#   1. Install cert-manager:
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
#   2. Install the ClickHouse operator:
#      helm install clickhouse-operator -n clickhouse-operator-system --create-namespace \
#        oci://ghcr.io/clickhouse/clickhouse-operator-helm
#
# Customize shards and storage to fit your workload. Each shard is a single
# replica; durability and disaster recovery are handled by the Apache Iceberg
# archive, not ClickHouse replication. Keeper stays for ON CLUSTER DDL.
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: bifract-keeper
  namespace: bifract
spec:
  replicas: 1
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "26.6.2.81-alpine"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: bifract-ch
  namespace: bifract
spec:
  replicas: 1
  keeperClusterRef:
    name: bifract-keeper
  podTemplate:
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: bifract-ch-clickhouse
              topologyKey: kubernetes.io/hostname
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 100Gi
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-server
      tag: "26.6.2.81-alpine"
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 16Gi
  settings:
    defaultUserPassword:
      passwordType: password_sha256_hex
      secret:
        name: bifract-secrets
        key: CLICKHOUSE_PASSWORD_HASH
    # Workload/resource definitions (the search CPU and memory limits the app
    # provisions with CREATE WORKLOAD) live in Keeper rather than each node's local
    # disk, so every node enforces the same limits and a node added later inherits them.
    extraConfig:
      workload_zookeeper_path: /clickhouse/workload/definitions.sql
