apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifract-ingest
  namespace: bifract
spec:
  # Independently scalable data-plane tier. Scale to 0 to pause ingest during
  # ClickHouse merge recovery while the app/UI tier keeps serving.
  replicas: 1
  selector:
    matchLabels:
      app: bifract-ingest
  template:
    metadata:
      labels:
        app: bifract-ingest
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bifract-ingest
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Ingest data plane: `/bifract-server ingest`. No control plane, no UI.
        - name: bifract-ingest
          image: ghcr.io/zanegittins/bifract:latest
          args: ["ingest"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            # PostgreSQL
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: bifract
            - name: POSTGRES_USER
              value: bifract
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifract-secrets
                  key: POSTGRES_PASSWORD
            # ClickHouse cluster
            - name: CLICKHOUSE_HOSTS
              value: "bifract-ch-clickhouse-0-0-0.bifract-ch-clickhouse-headless,bifract-ch-clickhouse-0-1-0.bifract-ch-clickhouse-headless"
            - name: CLICKHOUSE_PORT
              value: "9000"
            - name: CLICKHOUSE_DB
              value: logs
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifract-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_CLUSTER
              value: default
            - name: BIFRACT_PORT
              value: "8080"
            # Ingestion queue tuning
            - name: BIFRACT_INGEST_QUEUE_SIZE
              value: "100"
            - name: BIFRACT_INGEST_WORKERS
              value: "4"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bifract-ingest
  namespace: bifract
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: bifract-ingest
