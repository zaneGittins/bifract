name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      # Build-tagged tests are excluded from `go test ./...` and `go vet ./...`, so nothing
      # else compiles them. Without this they rot silently and are only discovered broken
      # the next time someone runs them by hand. Compiles only; the docker fixtures these
      # need are described in test/chcluster/README.md.
      - name: Vet tagged tests
        run: go vet -tags chcluster,chupgrade ./pkg/storage/

      # Same reasoning as above: the rule tester's ClickHouse-backed test is
      # build-tagged, so nothing else compiles it. Run it with
      # BIFRACT_TEST_CLICKHOUSE=host:port against any ClickHouse.
      - name: Vet rule tester integration test
        run: go vet -tags ruletestch ./internal/ruletest/

      # The shipped example detections are what users copy. Linting them needs no
      # database and catches a rule that stops translating.
      - name: Lint example detections
        run: go run ./cmd/bifract --test --lint ./example-detections/

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check
        run: govulncheck ./...
