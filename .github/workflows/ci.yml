name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Caddyfile syntax has no other guard: TestK8sManifestsAreValidYAML parses the
      # ConfigMap as YAML, so the Caddyfile inside it is an opaque string, and a bad
      # directive stops Caddy from starting. Pulled from the image compose deploys so
      # the check tracks the Caddy version actually run. TestCaddyfilesAdapt skips
      # without this.
      - name: Install Caddy
        run: |
          mkdir -p "$HOME/.local/bin"
          docker run --rm --entrypoint cat caddy:2-alpine /usr/bin/caddy > "$HOME/.local/bin/caddy"
          chmod +x "$HOME/.local/bin/caddy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/caddy" version

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      # Build-tagged tests are excluded from `go test ./...` and `go vet ./...`, so nothing
      # else compiles them. Without this they rot silently and are only discovered broken
      # the next time someone runs them by hand. Every tag is set at once over ./... so a
      # new tagged file in any package is covered without editing this step. Compiles only;
      # the fixtures these need are in test/chcluster/ and test/archiveminio/, and the rule
      # tester's takes BIFRACT_TEST_CLICKHOUSE=host:port against any ClickHouse.
      #
      # Keep in sync with: grep -rho '//go:build .*' --include='*.go' .
      - name: Vet tagged tests
        run: go vet -tags alertsdb,archiveminio,chcluster,chlive,chupgrade,integration,normlogesc,pglive,ruletestch ./...

      # The shipped example detections are what users copy. Linting them needs no
      # database and catches a rule that stops translating.
      - name: Lint example detections
        run: go run ./cmd/bifract --test --lint ./example-detections/

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check
        run: govulncheck ./...
