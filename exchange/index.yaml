# The Bifract Exchange: content any install can browse and add from the UI.
# Paths are relative to this file. `requires` lists items added first. See exchange/README.md to add an item.
items:
  # Lookups. Only the source settings are installed; rows refresh from upstream.
  - id: lolrmm
    kind: lookup
    name: LOLRMM tools
    description: >-
      Remote monitoring and management tools attackers abuse, keyed on their install
      paths as globs. Use with match() on a process image to flag RMM tools.
    author: Magic Sword
    homepage: https://lolrmm.io
    tags: [rmm, windows]
    lookup:
      list_kind: pattern
      source:
        url: https://raw.githubusercontent.com/magicsword-io/LOLRMM/main/website/public/api/rmm_tools.csv
        key_field: InstallationPaths
        columns: [Name, Description]
        split_key: ","
        key_format: glob
        refresh_minutes: 1440
  - id: celes_tlsh
    kind: lookup
    name: CelesTLSH attack tool hashes
    description: >-
      TLSH digests of public attack tools and C2 frameworks, keyed on TLSH_Hash. Use with
      tlsh(dict="celes_tlsh"), then match() on tlsh_match to bring in Repo_Name and File_Name.
    author: Magonia Research
    homepage: https://github.com/Magonia-Research/CelesTLSH-Hashes
    tags: [tlsh, malware]
    lookup:
      source:
        url: https://raw.githubusercontent.com/Magonia-Research/CelesTLSH-Hashes/refs/heads/main/all_attack_tools_hashes.csv
        format: csv
        key_field: TLSH Hash
        columns: [Repo Name, File Name, Release Version]
        refresh_minutes: 1440

  # Normalizers. Instance-wide; installing one needs a tenant admin.
  - id: sysmon
    kind: normalizer
    name: Sysmon
    description: Maps Windows Sysmon events onto Bifract's normalized fields, including bifract_category.
    tags: [windows, sysmon]
    path: normalizers/sysmon/sysmon-normalizer.yaml
  - id: limacharlie-process
    kind: normalizer
    name: LimaCharlie EDR - Process
    description: Maps LimaCharlie NEW_PROCESS and EXISTING_PROCESS events.
    tags: [limacharlie, edr]
    path: normalizers/limacharlie/limacharlie-process-normalizer.yaml
  - id: limacharlie-network
    kind: normalizer
    name: LimaCharlie EDR - Network
    description: Maps LimaCharlie NETWORK_CONNECTIONS, NEW_TCP4_CONNECTION and CODE_IDENTITY events.
    tags: [limacharlie, edr]
    path: normalizers/limacharlie/limacharlie-network-normalizer.yaml
  - id: limacharlie-activity
    kind: normalizer
    name: LimaCharlie EDR - Activity
    description: Maps LimaCharlie NEW_DOCUMENT, DNS_REQUEST and TERMINATE_PROCESS events.
    tags: [limacharlie, edr]
    path: normalizers/limacharlie/limacharlie-activity-normalizer.yaml
  - id: limacharlie-injection
    kind: normalizer
    name: LimaCharlie EDR - Injection
    description: Maps LimaCharlie REMOTE_PROCESS_HANDLE and NEW_REMOTE_THREAD events.
    tags: [limacharlie, edr]
    path: normalizers/limacharlie/limacharlie-injection-normalizer.yaml
  - id: limacharlie-detections
    kind: normalizer
    name: LimaCharlie - Detections
    description: Maps LimaCharlie D&R detections (output --type detect).
    tags: [limacharlie, edr]
    path: normalizers/limacharlie/limacharlie-detections-normalizer.yaml
  - id: limacharlie-wel-sysmon
    kind: normalizer
    name: LimaCharlie WEL - Sysmon
    description: Maps Sysmon events delivered through LimaCharlie's Windows Event Log stream.
    tags: [limacharlie, sysmon, windows]
    path: normalizers/limacharlie/limacharlie-wel-sysmon-normalizer.yaml

  # Detections. Each folder also holds tests that CI runs.

  # Analytics models. Fractal-scoped; installing one needs an analyst.
  - id: rmm_users
    kind: model
    name: RMM tools by user
    description: >-
      Rarity model of which LOLRMM tools each user runs, so a tool new to a user stands out.
      Needs Sysmon process events with a user field.
    tags: [rmm]
    path: models/rmm_users.yaml
    requires: [lolrmm]
  - id: tlsh_index
    kind: model
    name: TLSH index
    description: >-
      Indexes the distinct digests in the tlsh field, which tlsh() needs. Run a backfill
      after adding it to cover logs already stored.
    tags: [tlsh]
    path: models/tlsh_index.yaml

  # Detections.
  - id: rare-rmm-for-user
    kind: detection
    name: Remote Management Tool Rare for the User
    description: A user ran a LOLRMM tool that is new to them or a small share of their RMM use.
    tags: [windows, rmm, attack.t1219]
    path: detections/rare-rmm-for-user.yml
    requires: [rmm_users]
  - id: untrusted-binary-like-attack-tool
    kind: detection
    name: Untrusted Binary Similar to an Attack Tool
    description: >-
      An untrusted process within TLSH distance 50 of a public attack tool. Needs Sysmon
      process events enriched with tlsh and authenticode_trusted, such as Velociraptor's
      Windows.EventLogs.SysmonProcessEnriched produces.
    tags: [windows, tlsh, attack.t1588.002]
    path: detections/untrusted-binary-like-attack-tool.yml
    requires: [celes_tlsh, tlsh_index]

  # Saved searches. Shared with everyone in the scope.
  - id: lolrmm-executions
    kind: search
    name: LOLRMM tool executions
    description: Process starts whose image matches a LOLRMM install path, with the tool's name.
    tags: [rmm]
    path: searches/lolrmm-executions.yaml
    requires: [lolrmm]

  # Dashboards.
  - id: rmm-activity
    kind: dashboard
    name: Remote Management Tools
    description: Which RMM tools run, where, by whom, and which are rare for their user.
    tags: [rmm]
    path: dashboards/rmm-activity.yaml
    requires: [lolrmm, rmm_users]
  - id: celes-tlsh-dashboard
    kind: dashboard
    name: TLSH Similarity to Attack Tools
    description: Executables close to public attack tools by TLSH distance, by family, host and time.
    tags: [tlsh]
    path: dashboards/celes-tlsh.yaml
    requires: [celes_tlsh, tlsh_index]

  # Alert policies. Installing appends the rules to the scope's rule set.
  - id: soc-baseline
    kind: policy
    name: SOC baseline
    description: Conservative alert policy rules. ATT&CK labels and no wildcard queries block; the rest advise.
    path: policies/soc-baseline.yaml

  # Datasets. Each is imported into a new fractal named after its id; needs a tenant admin.
  - id: bifract-labs-001
    kind: dataset
    name: "Lab 001: Meridian workstation intrusion"
    description: >-
      Three days of endpoint and network telemetry from a small Windows domain, with an
      intrusion inside it. Sysmon, Windows event logs, Zeek and Velociraptor Autoruns from
      a domain controller, three workstations and a network sensor. Domains and attacker
      infrastructure are fictional; do not contact any indicator in it.
    author: Bifract Labs
    homepage: https://labs.bifract.io/001/
    tags: [windows, sysmon, zeek, training]
    dataset:
      url: https://github.com/zaneGittins/bifract-labs/releases/download/lab-001/bifract-labs-001.jsonl.zst
      sha256: 2583aeee2a941d6ea32aedd9af7fb11a95403fbdc091d34e146fb99fa760fbc5
      bytes: 118236887
      logs: 2083151
      start: 2026-10-27T08:37:53Z
      end: 2026-10-30T13:49:59Z

  # Bundles. Adding one adds each member not already present, requirements first.
  - id: rmm-hunting
    kind: bundle
    name: Remote management tool hunting
    description: >-
      Find remote monitoring and management tools from Magic Sword's LOLRMM list: the
      lookup, a per-user rarity model, an alert for tools rare for their user, a saved
      search and a dashboard.
    author: Magic Sword
    homepage: https://lolrmm.io
    tags: [rmm, windows]
    items: [lolrmm, rmm_users, rare-rmm-for-user, lolrmm-executions, rmm-activity]
  - id: celes-tlsh-hunting
    kind: bundle
    name: CelesTLSH fuzzy hash hunting
    description: >-
      Find variants of public attack tools by TLSH similarity: Magonia Research's CelesTLSH
      lookup, the TLSH index, an alert for untrusted binaries close to a tool, and a
      dashboard. Needs process events with a tlsh field.
    author: Magonia Research
    homepage: https://github.com/Magonia-Research/CelesTLSH-Hashes
    tags: [tlsh, malware]
    items: [celes_tlsh, tlsh_index, untrusted-binary-like-attack-tool, celes-tlsh-dashboard]
  - id: limacharlie
    kind: bundle
    name: LimaCharlie normalizers
    description: Every LimaCharlie normalizer, covering EDR process, network, activity and injection events, detections, and Sysmon over WEL.
    tags: [limacharlie, edr]
    items:
      - limacharlie-process
      - limacharlie-network
      - limacharlie-activity
      - limacharlie-injection
      - limacharlie-detections
      - limacharlie-wel-sysmon
