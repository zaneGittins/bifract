# Minimal backing services for the archive compaction harness: an S3-compatible
# object store for the Iceberg data/metadata and a Postgres for the SQL catalog.
# Deliberately not the full Bifract stack -- the harness drives pkg/archive
# directly, so ClickHouse, Caddy and the app tier are not involved.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":19091"
    environment:
      MINIO_ROOT_USER: bifracttest
      MINIO_ROOT_PASSWORD: bifracttest
    ports:
      - "19090:9000"
      - "19091:19091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bifracttest bifracttest &&
      mc mb --ignore-existing local/bifract-archive-test &&
      echo bucket ready"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bifract
      POSTGRES_PASSWORD: bifract
      POSTGRES_DB: bifract
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifract"]
      interval: 3s
      timeout: 3s
      retries: 20
